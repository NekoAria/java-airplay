plugins {
    id 'io.freefair.lombok' version '9.5.0'
    id 'com.adarshr.test-logger' version '4.0.0'
}

ext {
    flatlafVersion = '3.7.2'
    springDepMgmtVersion = '1.1.7'
    junitVersion = '5.14.4'
    nettyVersion = '4.2.17.Final'
    slf4jVersion = '2.0.18'
    logbackVersion = '1.5.38'
    jnaVersion = '5.19.1'
    jmdnsVersion = '3.6.3'
    plistVersion = '1.28'
    eddsaVersion = '0.3.0'
    curve25519Version = '0.5.0'
    gstreamerCoreVersion = '1.4.0'
    gstreamerSwingVersion = '0.9.0'
}

allprojects {
    apply plugin: 'java'

    group = 'wtf.nanoka'
    version = providers.gradleProperty('version').getOrElse('1.0.10')

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

subprojects {
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'com.adarshr.test-logger'

    dependencies {
        implementation "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"
        implementation "com.googlecode.plist:dd-plist:${rootProject.ext.plistVersion}"

        testImplementation(platform("org.junit:junit-bom:${rootProject.ext.junitVersion}"))
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs '--enable-native-access=ALL-UNNAMED', '-Dio.netty.noUnsafe=true'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
    }
}

wrapper {
    gradleVersion = '9.7.1'
    distributionType = Wrapper.DistributionType.BIN
}

def windows = System.getProperty('os.name').toLowerCase().contains('windows')
def releaseRuntimeDirectory = layout.buildDirectory.dir('release/windows-x64/runtime')
def releaseStagingDirectory = layout.buildDirectory.dir('release/windows-x64/stage')
def windowsLauncherFile = layout.buildDirectory.file(
        'release/windows-x64/launcher/JavaAirPlayReceiver.exe')
def windowsIconFile = layout.buildDirectory.file(
        'release/windows-x64/launcher/java-airplay.ico')
def localGStreamerDirectory = layout.projectDirectory.dir('.runtime/gstreamer')
def releaseOutputDirectory = layout.projectDirectory.dir('release')
def windowsPackagingDirectory = layout.projectDirectory.dir('packaging/windows')
def windowsLauncherSource = windowsPackagingDirectory.file('AirPlayReceiver.cs')
def windowsIconSource = windowsPackagingDirectory.file('make_icon.py')
def windowsInstallerSource = windowsPackagingDirectory.file('installer.iss')
def windowsInstallerLanguageSource = windowsPackagingDirectory.file('ChineseSimplified.isl')
def windowsInstallerLanguageLicenseSource =
        windowsPackagingDirectory.file('ChineseSimplified.LICENSE.txt')
def windowsDistributionValidator = windowsPackagingDirectory.file('validate_distribution.ps1')
def windowsStartScript = layout.projectDirectory.file('scripts/start.ps1')
def windowsBuildWorkflow = layout.projectDirectory.file('.github/workflows/build.yaml')
def windowsReleaseWorkflow = layout.projectDirectory.file('.github/workflows/release.yaml')

// Release artifacts carry the current UTC build date as a yyMMdd suffix. CI supplies
// releaseDate explicitly so configuration-cache reuse cannot preserve yesterday's date.
def releaseBuildDate = providers.gradleProperty('releaseDate').orElse(providers.provider {
    new Date().format('yyMMdd', TimeZone.getTimeZone('UTC'))
}).map { date ->
    if (!(date ==~ /\d{6}/)) {
        throw new GradleException("releaseDate must use yyMMdd format: ${date}")
    }
    date
}
def baseVersion = project.version.toString()
def releaseVersion = releaseBuildDate.map { date ->
    def value = "${baseVersion}.${date}"
    if (!(value ==~ /[0-9A-Za-z][0-9A-Za-z._+\-]*/)) {
        throw new GradleException("Release version contains unsupported characters: ${value}")
    }
    value
}
def releaseBaseName = releaseVersion.map { value -> "java-airplay-${value}-windows-x64" }
def installerBaseName = releaseBaseName.map { value -> "${value}-setup" }
def portableArtifactFile = providers.provider {
    new File(releaseOutputDirectory.asFile, "${releaseBaseName.get()}.zip")
}
def portableChecksumFile = providers.provider {
    new File(releaseOutputDirectory.asFile, "${releaseBaseName.get()}.zip.sha256")
}
def installerArtifactFile = providers.provider {
    new File(releaseOutputDirectory.asFile, "${installerBaseName.get()}.exe")
}
def installerChecksumFile = providers.provider {
    new File(releaseOutputDirectory.asFile, "${installerBaseName.get()}.exe.sha256")
}
def pythonExecutable = providers.environmentVariable('PYTHON').orElse(
        windows ? 'python.exe' : 'python3')

def requireWindows = {
    if (!windows) {
        throw new GradleException('The Windows x64 release must be built on Windows.')
    }
}

def writeSha256 = { File artifact, File checksumFile ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int bytesRead
        while ((bytesRead = input.read(buffer)) != -1) {
            digest.update(buffer, 0, bytesRead)
        }
    }
    def checksum = digest.digest().collect { String.format('%02x', it) }.join()
    checksumFile.parentFile.mkdirs()
    checksumFile.setText("${checksum}  ${artifact.name}\n", 'UTF-8')
}

tasks.register('validateWindowsPackagingSources') {
    group = 'verification'
    description = 'Validates the security and layout contracts of the Windows packaging sources.'
    inputs.files(windowsLauncherSource, windowsIconSource, windowsInstallerSource,
            windowsInstallerLanguageSource, windowsInstallerLanguageLicenseSource,
            windowsDistributionValidator, windowsStartScript, windowsBuildWorkflow,
            windowsReleaseWorkflow)
    doLast {
        def launcher = windowsLauncherSource.asFile.getText('UTF-8')
        [
                'runtime", "bin',
                '.runtime", "gstreamer',
                'java-airplay-server.jar',
                '--enable-native-access=ALL-UNNAMED',
                '-Dgstreamer.path=',
                'GST_PLUGIN_SCANNER_1_0',
                'startInfo.EnvironmentVariables["GST_REGISTRY_1_0"]',
                'DeleteFile(validationFileBasePath + ".gst-registry.bin");',
                '--validate-installation',
                '--java-airplay.validation=true',
                '--player.implementation=gstreamer',
                'WaitForExit(ValidationTimeoutMilliseconds)',
                'return process.ExitCode;'
        ].each { required ->
            if (!launcher.contains(required)) {
                throw new GradleException("Windows launcher is missing required contract: ${required}")
            }
        }

        def installer = windowsInstallerSource.asFile.getText('UTF-8')
        if (installer =~ /(?m)^\s*#define\s+AppVersion\b/) {
            throw new GradleException('The Inno Setup version must be supplied by Gradle, not hard-coded.')
        }
        def normalizedInstaller = installer.toLowerCase()
        if (normalizedInstaller.contains('users-modify') || normalizedInstaller.contains('permissions:')) {
            throw new GradleException('The installer must not make the Program Files application directory user-writable.')
        }
        def installerLanguageText = windowsInstallerLanguageSource.asFile.getText('UTF-8')
        [
                'Inno Setup version 6.5.0+ Chinese Simplified messages',
                'LanguageName=简体中文',
                'LanguageID=$0804'
        ].each { required ->
            if (!installerLanguageText.contains(required)) {
                throw new GradleException("The bundled Chinese installer language is missing: ${required}")
            }
        }
        def installerLanguageLicenseText =
                windowsInstallerLanguageLicenseSource.asFile.getText('UTF-8')
        if (!installerLanguageLicenseText.contains('Inno Setup License')
                || !installerLanguageLicenseText.contains('https://jrsoftware.org/')) {
            throw new GradleException('The bundled Chinese installer language license is incomplete.')
        }
        def startScript = windowsStartScript.asFile.getText('UTF-8')
        if (!startScript.contains("Join-Path \$Workspace 'java-airplay-server.jar'")) {
            throw new GradleException('The fallback PowerShell launcher must support the stable packaged JAR name.')
        }
        def validator = windowsDistributionValidator.asFile.getText('UTF-8')
        ['--validate-installation', 'gst-plugin-scanner.exe', 'avdec_h265', 'avdec_alac'].each { required ->
            if (!validator.contains(required)) {
                throw new GradleException("Windows distribution validator is missing contract: ${required}")
            }
        }
        def buildWorkflow = windowsBuildWorkflow.asFile.getText('UTF-8')
        def releaseWorkflow = windowsReleaseWorkflow.asFile.getText('UTF-8')
        if (!buildWorkflow.contains('uses: ./.github/workflows/release.yaml')) {
            throw new GradleException('Push and pull request CI must run the reusable Windows release workflow.')
        }
        if (!releaseWorkflow.contains('workflow_call:')
                || !releaseWorkflow.contains("if: startsWith(github.ref, 'refs/tags/v')")) {
            throw new GradleException('The Windows release workflow must be reusable without publishing CI builds.')
        }
        if (releaseWorkflow.contains('-Pversion=${{')
                || !releaseWorkflow.contains('"-Pversion=$env:RELEASE_VERSION"')) {
            throw new GradleException('The release tag must reach Gradle through a quoted environment variable.')
        }
        if (!releaseWorkflow.contains(':player:gstreamer:nativeGStreamerTest --rerun-tasks')) {
            throw new GradleException(
                    'Windows releases must execute the required native GStreamer test suite explicitly.')
        }
        if (!releaseWorkflow.contains('$installDirectory = Join-Path $env:RUNNER_TEMP')
                || !releaseWorkflow.contains('"/DIR=`"$installDirectory`""')) {
            throw new GradleException('Windows installer validation must use an explicit temporary directory.')
        }
        if (!releaseWorkflow.contains("'Java AirPlay Portable café'")
                || !releaseWorkflow.contains("'Java AirPlay Installed café'")) {
            throw new GradleException(
                    'Windows distribution validation must exercise paths with spaces and code-page-compatible non-ASCII characters.')
        }
        [
                '#ifndef AppVersion',
                'DefaultDirName={autopf}',
                'MessagesFile: "ChineseSimplified.isl"',
                'PrivilegesRequired=admin',
                'MinVersion=10.0',
                'ArchitecturesAllowed=x64compatible',
                'ArchitecturesInstallIn64BitMode=x64compatible',
                'runasoriginaluser'
        ].each { required ->
            if (!installer.contains(required)) {
                throw new GradleException("Inno Setup script is missing required contract: ${required}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'validateWindowsPackagingSources'
}

tasks.register('linuxJvmTest') {
    group = 'verification'
    description = 'Runs every test that is safe without native GStreamer or a desktop runtime.'
    dependsOn subprojects.findAll { it.path != ':player:gstreamer' }
            .collect { "${it.path}:test" }
    dependsOn ':player:gstreamer:pureJvmTest'
}

tasks.register('generateWindowsLauncherIcon', Exec) {
    group = 'distribution'
    description = 'Generates the multi-resolution Windows launcher icon.'
    inputs.file(windowsIconSource)
    outputs.file(windowsIconFile)
    doFirst {
        def iconFile = windowsIconFile.get().asFile
        iconFile.parentFile.mkdirs()
        commandLine pythonExecutable.get(), windowsIconSource.asFile.absolutePath,
                '--output', iconFile.absolutePath
    }
}

tasks.register('compileWindowsLauncher', Exec) {
    group = 'distribution'
    description = 'Compiles the native no-console Windows launcher.'
    dependsOn 'generateWindowsLauncherIcon', 'validateWindowsPackagingSources'
    inputs.file(windowsLauncherSource)
    inputs.file(windowsIconFile)
    outputs.file(windowsLauncherFile)
    doFirst {
        requireWindows()
        def windowsDirectory = System.getenv('WINDIR') ?: 'C:\\Windows'
        def configuredCompiler = System.getenv('CSC')
        def candidates = []
        if (configuredCompiler) {
            candidates.add(new File(configuredCompiler))
        }
        candidates.add(new File(windowsDirectory, 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'))
        candidates.add(new File(windowsDirectory, 'Microsoft.NET/Framework/v4.0.30319/csc.exe'))
        def compiler = candidates.find { it.isFile() }
        if (compiler == null) {
            throw new GradleException(
                    'The .NET Framework C# compiler was not found. Set CSC to a valid csc.exe path.')
        }
        def launcherFile = windowsLauncherFile.get().asFile
        def iconFile = windowsIconFile.get().asFile
        launcherFile.parentFile.mkdirs()
        commandLine compiler.absolutePath,
                '/nologo', '/target:winexe', '/platform:x64', '/optimize+', '/codepage:65001',
                '/reference:System.Windows.Forms.dll',
                "/win32icon:${iconFile.absolutePath}",
                "/out:${launcherFile.absolutePath}",
                windowsLauncherSource.asFile.absolutePath
    }
}

tasks.register('prepareGStreamerRuntime', Exec) {
    group = 'distribution'
    description = 'Checks or prepares the project-local Windows GStreamer runtime.'
    doFirst {
        requireWindows()
    }
    commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', layout.projectDirectory.file('scripts/bootstrap-runtime.ps1').asFile.absolutePath
    outputs.upToDateWhen { false }
}

project(':player:gstreamer').tasks.named('test') {
    mustRunAfter rootProject.tasks.named('prepareGStreamerRuntime')
}

tasks.register('cleanReleaseJavaRuntime', Delete) {
    group = 'distribution'
    delete releaseRuntimeDirectory
}

tasks.register('createReleaseJavaRuntime', Exec) {
    group = 'distribution'
    description = 'Creates a compact Java 25 runtime for the Windows release.'
    dependsOn 'cleanReleaseJavaRuntime'
    def launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    inputs.property('javaVersion', 25)
    // Do not declare the runtime directory as an output: Gradle creates output
    // directories before execution, but jlink requires the directory to be absent.
    doFirst {
        requireWindows()
        def javaHome = launcher.get().metadata.installationPath.asFile
        executable = new File(javaHome, 'bin/jlink.exe').absolutePath
        args '--add-modules', 'java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.localedata,jdk.charsets',
                '--strip-debug', '--no-header-files', '--no-man-pages', '--compress', 'zip-6',
                '--output', releaseRuntimeDirectory.get().asFile.absolutePath
    }
}

tasks.register('stageWindowsRelease', Sync) {
    group = 'distribution'
    description = 'Stages the complete portable and installer payload with stable file names.'
    dependsOn ':player:app:bootJar', 'prepareGStreamerRuntime', 'createReleaseJavaRuntime',
            'compileWindowsLauncher'
    into releaseStagingDirectory
    includeEmptyDirs = false

    from("player/app/build/libs/java-airplay-server-${project.version}.jar") {
        rename { 'java-airplay-server.jar' }
    }
    from(windowsLauncherFile)
    from('start.bat')
    from('scripts') {
        into 'scripts'
    }
    from('README.md', 'README.zh-CN.md', 'LICENSE')
    from('config/application.example.properties') {
        into 'config'
    }
    from('config/application.example.properties') {
        into 'config'
        rename { 'application.properties' }
    }
    from(releaseRuntimeDirectory) {
        into 'runtime'
    }
    from(localGStreamerDirectory) {
        into '.runtime/gstreamer'
        include 'bin/**', 'lib/**/*.dll', 'libexec/**', 'etc/**', 'share/**'
    }
}

tasks.register('verifyWindowsReleaseStage') {
    group = 'verification'
    description = 'Checks the staged Windows payload before archiving or installer compilation.'
    dependsOn 'stageWindowsRelease'
    inputs.dir(releaseStagingDirectory)
    doLast {
        def stage = releaseStagingDirectory.get().asFile
        [
                'JavaAirPlayReceiver.exe',
                'java-airplay-server.jar',
                'start.bat',
                'runtime/bin/java.exe',
                'runtime/bin/javaw.exe',
                '.runtime/gstreamer/bin/gst-inspect-1.0.exe',
                '.runtime/gstreamer/libexec/gstreamer-1.0/gst-plugin-scanner.exe',
                'config/application.properties',
                'config/application.example.properties',
                'LICENSE'
        ].each { relativePath ->
            if (!new File(stage, relativePath).isFile()) {
                throw new GradleException("Windows release stage is missing ${relativePath}")
            }
        }
        def pluginDirectory = new File(stage, '.runtime/gstreamer/lib/gstreamer-1.0')
        if (!pluginDirectory.isDirectory()
                || !pluginDirectory.listFiles().any { it.isFile() && it.name.endsWith('.dll') }) {
            throw new GradleException('Windows release stage does not contain GStreamer plugins.')
        }
        def serverJars = stage.listFiles().findAll {
            it.isFile() && it.name.startsWith('java-airplay-server') && it.name.endsWith('.jar')
        }
        if (serverJars*.name != ['java-airplay-server.jar']) {
            throw new GradleException("Windows release must contain one stable server JAR: ${serverJars*.name}")
        }
    }
}

tasks.register('validateStagedWindowsDistribution', Exec) {
    group = 'verification'
    description = 'Smoke-tests the staged launcher and required bundled GStreamer plugins.'
    dependsOn 'verifyWindowsReleaseStage'
    inputs.file(windowsDistributionValidator)
    inputs.dir(releaseStagingDirectory)
    doFirst {
        requireWindows()
        commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', windowsDistributionValidator.asFile.absolutePath,
                '-Root', releaseStagingDirectory.get().asFile.absolutePath
    }
}

tasks.register('buildPortableRelease', Zip) {
    group = 'distribution'
    description = 'Builds the self-contained Windows x64 portable ZIP.'
    dependsOn 'validateStagedWindowsDistribution'
    archiveFileName = releaseBaseName.map { "${it}.zip" }
    destinationDirectory = releaseOutputDirectory
    zip64 = true
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    into(releaseBaseName) {
        from(releaseStagingDirectory)
    }
}

tasks.register('buildWindowsInstaller', Exec) {
    group = 'distribution'
    description = 'Compiles the standard Windows x64 installer with Inno Setup.'
    dependsOn 'validateStagedWindowsDistribution', 'generateWindowsLauncherIcon'
    inputs.file(windowsInstallerSource)
    inputs.file(windowsInstallerLanguageSource)
    inputs.dir(releaseStagingDirectory)
    inputs.file(windowsIconFile)
    inputs.property('releaseVersion', releaseVersion)
    outputs.file(installerArtifactFile)
    doFirst {
        requireWindows()
        def version = releaseVersion.get()
        def configuredCompiler = System.getenv('INNO_SETUP_COMPILER')
        def candidates = []
        if (configuredCompiler) {
            candidates.add(new File(configuredCompiler))
        }
        def programFilesX86 = System.getenv('ProgramFiles(x86)')
        def programFiles = System.getenv('ProgramFiles')
        def localAppData = System.getenv('LOCALAPPDATA')
        if (programFilesX86) {
            candidates.add(new File(programFilesX86, 'Inno Setup 6/ISCC.exe'))
        }
        if (programFiles) {
            candidates.add(new File(programFiles, 'Inno Setup 6/ISCC.exe'))
        }
        if (localAppData) {
            candidates.add(new File(localAppData, 'Programs/Inno Setup 6/ISCC.exe'))
        }
        def compiler = candidates.find { it.isFile() }
        if (compiler == null) {
            throw new GradleException(
                    'Inno Setup 6.5+ was not found. Set INNO_SETUP_COMPILER to a valid ISCC.exe path.')
        }
        releaseOutputDirectory.asFile.mkdirs()
        commandLine compiler.absolutePath,
                '/Qp',
                "/DAppVersion=${version}",
                "/DStageDir=${releaseStagingDirectory.get().asFile.absolutePath}",
                "/DOutputDir=${releaseOutputDirectory.asFile.absolutePath}",
                "/DIconFile=${windowsIconFile.get().asFile.absolutePath}",
                windowsInstallerSource.asFile.absolutePath
    }
}

tasks.register('checksumPortableRelease') {
    group = 'distribution'
    description = 'Writes the SHA-256 checksum for the portable ZIP.'
    dependsOn 'buildPortableRelease'
    inputs.file(portableArtifactFile)
    outputs.file(portableChecksumFile)
    doLast {
        writeSha256(portableArtifactFile.get(), portableChecksumFile.get())
    }
}

tasks.register('checksumWindowsInstaller') {
    group = 'distribution'
    description = 'Writes the SHA-256 checksum for the Windows installer.'
    dependsOn 'buildWindowsInstaller'
    inputs.file(installerArtifactFile)
    outputs.file(installerChecksumFile)
    doLast {
        writeSha256(installerArtifactFile.get(), installerChecksumFile.get())
    }
}

tasks.register('release') {
    group = 'distribution'
    description = 'Builds the portable ZIP, native launcher, Windows installer, and SHA-256 files.'
    dependsOn subprojects.findAll { it.path != ':player:gstreamer' }
            .collect { "${it.path}:test" }
    dependsOn 'checksumPortableRelease', 'checksumWindowsInstaller'
}
