plugins {
    id 'io.freefair.lombok' version '9.5.0'
    id 'com.adarshr.test-logger' version '4.0.0'
}

ext {
    springBootVersion = '4.0.7'
    springDepMgmtVersion = '1.1.7'
    junitVersion = '5.14.4'
    nettyVersion = '4.2.15.Final'
    slf4jVersion = '2.0.18'
    logbackVersion = '1.5.38'
    jnaVersion = '5.19.1'
    jmdnsVersion = '3.6.3'
    plistVersion = '1.26'
    eddsaVersion = '0.3.0'
    curve25519Version = '0.5.0'
    gstreamerCoreVersion = '1.4.0'
    gstreamerSwingVersion = '0.9.0'
}

allprojects {
    apply plugin: 'java'

    group = 'wtf.nanoka'
    version = providers.gradleProperty('version').getOrElse('1.0.7')

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

subprojects {
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'com.adarshr.test-logger'

    dependencies {
        implementation "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"
        implementation "com.googlecode.plist:dd-plist:${rootProject.ext.plistVersion}"

        testImplementation(platform("org.junit:junit-bom:${rootProject.ext.junitVersion}"))
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
        jvmArgs '--enable-native-access=ALL-UNNAMED', '-Dio.netty.noUnsafe=true'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
    }
}

wrapper {
    gradleVersion = '9.7.0'
    distributionType = Wrapper.DistributionType.BIN
}

def windows = System.getProperty('os.name').toLowerCase().contains('windows')
def releaseRuntimeDirectory = layout.buildDirectory.dir('release/windows-x64/runtime')
def localGStreamerDirectory = layout.projectDirectory.dir('.runtime/gstreamer')
def releaseOutputDirectory = layout.projectDirectory.dir('release')
def releaseBaseName = "java-airplay-${project.version}-windows-x64"

tasks.register('prepareGStreamerRuntime', Exec) {
    group = 'distribution'
    description = 'Checks or prepares the project-local Windows GStreamer runtime.'
    doFirst {
        if (!windows) {
            throw new GradleException('The Windows x64 release must be built on Windows.')
        }
    }
    commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', layout.projectDirectory.file('scripts/bootstrap-runtime.ps1').asFile.absolutePath
    outputs.upToDateWhen { false }
}

tasks.register('cleanReleaseJavaRuntime', Delete) {
    group = 'distribution'
    delete releaseRuntimeDirectory
}

tasks.register('createReleaseJavaRuntime', Exec) {
    group = 'distribution'
    description = 'Creates a compact Java 25 runtime for the Windows release.'
    dependsOn 'cleanReleaseJavaRuntime'
    def launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    inputs.property('javaVersion', 25)
    doFirst {
        if (!windows) {
            throw new GradleException('The Windows x64 release must be built on Windows.')
        }
        def javaHome = launcher.get().metadata.installationPath.asFile
        executable = new File(javaHome, 'bin/jlink.exe').absolutePath
        args '--add-modules', 'java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.localedata,jdk.charsets',
                '--strip-debug', '--no-header-files', '--no-man-pages', '--compress', 'zip-6',
                '--output', releaseRuntimeDirectory.get().asFile.absolutePath
    }
}

tasks.register('release', Zip) {
    group = 'distribution'
    description = 'Builds the complete, end-user-ready Windows x64 ZIP distribution.'
    dependsOn ':player:app:bootJar', 'prepareGStreamerRuntime', 'createReleaseJavaRuntime'

    archiveFileName = "${releaseBaseName}.zip"
    destinationDirectory = releaseOutputDirectory
    zip64 = true
    includeEmptyDirs = false

    into(releaseBaseName) {
        from(layout.projectDirectory.file("player/app/build/libs/java-airplay-server-${project.version}.jar"))
        from('start.bat')
        from('scripts') {
            into 'scripts'
        }
        from('README.md', 'README.zh-CN.md', 'LICENSE')
        from('config/application.example.properties') {
            into 'config'
        }
        from('config/application.example.properties') {
            into 'config'
            rename { 'application.properties' }
        }
        from(releaseRuntimeDirectory) {
            into 'runtime'
        }
        from(localGStreamerDirectory) {
            into '.runtime/gstreamer'
            include 'bin/**'
            include 'lib/**/*.dll'
            include 'libexec/**'
            include 'etc/**'
            include 'share/**'
        }
    }

    doLast {
        def zipFile = archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        zipFile.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def checksum = digest.digest().collect { String.format('%02x', it) }.join()
        def checksumFile = new File(zipFile.parentFile, zipFile.name + '.sha256')
        checksumFile.setText("${checksum}  ${zipFile.name}\n", 'UTF-8')
        logger.lifecycle("Release created: ${zipFile}")
        logger.lifecycle("SHA-256: ${checksum}")
    }
}
