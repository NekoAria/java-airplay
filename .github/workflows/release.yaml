name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v6
      - id: version
        shell: pwsh
        run: |
          "value=$($env:GITHUB_REF_NAME -replace '^v', '')" >> $env:GITHUB_OUTPUT
      - run: .\gradlew.bat release -Pversion=${{ steps.version.outputs.value }}

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          files: |
            release/*.zip
            release/*.sha256
