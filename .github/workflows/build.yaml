name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --warning-mode all
