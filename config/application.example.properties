# iPhone“屏幕镜像”列表中显示的接收器名称。
airplay.serverName=Java AirPlay
# 向 iPhone 声明的最大宽度。可填写整数，或填写 auto 在连接后读取手机视频流。
airplay.width=1920
# 向 iPhone 声明的最大高度。可填写整数，或填写 auto 在连接后读取手机视频流。
airplay.height=1080
# 向 iPhone 声明的最大帧率。可填写整数，或填写 auto 在连接后从时间戳测量。
airplay.fps=60
# 接收器持久身份文件。重启时请保留，否则手机会把它识别为新设备。
airplay.identityFile=${user.home}/.java-airplay/identity.key
# 音频乱序缓冲包数量。数值越小延迟越低，数值越大越能抵抗 Wi-Fi 抖动。
airplay.audioJitterPackets=3
# Pair-Verify 成功前拒绝媒体 SETUP，建议保持开启。
airplay.requirePairing=true

# 生产环境建议使用 INFO；排查握手、网络和时序问题时可临时改为 DEBUG。
logging.level.wtf.nanoka=INFO
# Spring 网络基础设施日志级别。
logging.level.org.springframework.web=INFO
# Netty 框架日志级别。
logging.level.io.netty=INFO
# Netty 控制连接管线日志级别。
logging.level.io.netty.handler.logging.LoggingHandler=INFO
# mDNS/JmDNS 服务发现日志级别。
logging.level.javax.jmdns=WARN
# GStreamer Java 绑定日志级别。
logging.level.org.freedesktop.gstreamer=INFO
# 将日志写入用户目录，不写入程序目录。
logging.file.name=${user.home}/.java-airplay/java-airplay.log
# 日志达到该大小后滚动。
logging.logback.rollingpolicy.max-file-size=10MB
# 保留的历史滚动日志数量。
logging.logback.rollingpolicy.max-history=7
# 在终端中保留彩色控制台日志。
spring.output.ansi.enabled=ALWAYS

# 播放后端：gstreamer、ffmpeg、vlc 或 h264-dump。
player.implementation=gstreamer
# 是否显示带 Quit 操作的系统托盘图标。
player.tray.enabled=true
# 是否使用 Swing 视频组件。false 使用原生 sink，延迟更低。
player.gstreamer.swing=false
# H.264 解码器：auto、d3d12h264dec、d3d11h264dec、nvh264dec、vulkanh264dec、avdec_h264、vah264dec、v4l2h264dec 或 vtdec_hw。
player.gstreamer.videoDecoder=auto
# GPU 适配器：auto 自动选择；也可填写 DXGI 原生索引 0、1、2、3……，不限制为 0/1。
# 该索引来自 DXGI 枚举，不保证与 Windows 任务管理器显示的 GPU 编号相同。
# 数字索引适用于 d3d12h264dec/d3d11h264dec；nvh264dec 的 CUDA 设备无法可靠映射到 DXGI 索引。
# 被选中的 GPU 必须已由 GStreamer 注册对应的 H.264 硬件解码器，否则启动时会明确报错。
player.gstreamer.gpuAdapter=auto
# 解码前最多缓存的视频访问单元数量，满后丢弃最旧帧以限制延迟。
player.gstreamer.videoQueueDepth=2
